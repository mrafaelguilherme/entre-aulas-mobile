name: CI

on:
  push:
    branches: [main, fase-4]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      # Guarda o MongoDB dos testes fora de node_modules, para o cache valer.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Cache the MongoDB binary used by the tests
        uses: actions/cache@v6
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-v1
      - run: npm ci
      - run: npm run lint
      - run: npm run test:cov
      - run: npm run test:e2e
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  mobile:
    name: App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node --test "scripts/*.test.mjs"

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [api]
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/setup-env.mjs
      - run: docker compose build
      - name: Publish the API image on Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.DOCKERHUB_USERNAME != ''
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker tag entre-aulas-api "$DOCKERHUB_USERNAME/entre-aulas-api:latest"
          docker push "$DOCKERHUB_USERNAME/entre-aulas-api:latest"
